{% load static %}
{% extends "restaurant/base.html" %}{% block title %}Make a reservation | Little Lemon{% endblock %}{% block scripts %}<script src="{% static 'restaurant/bookings.js' %}" defer></script>{% endblock %}{% block content %}<h1>Make a reservation</h1><div class="columns"><form id="booking-form">{% csrf_token %}<label for="first_name">Name:</label><input id="first_name" type="text" maxlength="100" placeholder="Your Name" required><label for="reservation_date">Reservation date:</label><input id="reservation_date" type="date" value="{{ today }}" min="{{ today }}" required><label for="reservation_slot">Reservation time:</label><select id="reservation_slot" required></select><button class="button" type="submit">Reserve</button><p id="form-message" role="status"></p></form><section><h2>Bookings For <span id="selected-date">{{ today }}</span></h2><ul id="booking-list"></ul></section></div>{% endblock %}
